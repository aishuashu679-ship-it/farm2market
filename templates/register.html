
{% extends "base.html" %}
{% block title %}Register | Farm2Market{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Create an account</h1>
  <p class="muted">Join as a farmer or a buyer.</p>

  <form method="post">
    <label>Full name
      <input name="name" required maxlength="100" placeholder="Enter your name">
    </label>

    <label>Email address
      <input type="email" name="email" required maxlength="150" placeholder="you@example.com">
    </label>

    <label>Password
      <input type="password" name="password" required minlength="6" placeholder="At least 6 characters">
    </label>

    <label>Location
      <input name="location" required maxlength="100" placeholder="Enter your village or town">
    </label>

    <label>Register as
      <select name="role">
        <option value="farmer">Farmer</option>
        <option value="buyer">Buyer</option>
      </select>
    </label>

    <button class="button full" type="submit">Create Account</button>
  </form>

  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
</section>
{% endblock %}
