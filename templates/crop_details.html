
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Crop Details - Farm2Market</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f7ef;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 550px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px #0001;
        }

        h2 {
            color: #26743b;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #26743b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            background: #fff0f0;
            color: #a22;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #26743b;
        }

        select:disabled {
            background: #eee;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🌾 Submit Crop Details</h2>

    <p>Enter your crop information to find suitable buyers.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('crop_details') }}">

        <label>Crop Category</label>
        <select name="category" id="category" required>
            <option value="">Select Category</option>
            <option value="Commercial Crops">Commercial Crops</option>
            <option value="Spices">Spices</option>
            <option value="Cereals">Cereals</option>
            <option value="Fruits">Fruits</option>
            <option value="Vegetables">Vegetables</option>
        </select>

        <label>Crop Name</label>
        <select name="crop_name" id="crop_name" required disabled>
            <option value="">Select Crop</option>
        </select>

        <label>Crop Variety</label>
        <select name="variety" id="variety" required disabled>
            <option value="">Select Variety</option>
        </select>

        <label>Quantity (kg)</label>
        <input type="number" name="quantity"
               min="0.01" step="0.01"
               placeholder="Example: 100" required>

        <label>Farmer Location</label>
        <input type="text" name="location"
               placeholder="Example: Bengaluru" required>

        <label>Expected Price (₹ per kg)</label>
        <input type="number" name="expected_price"
               min="0" step="0.01"
               placeholder="Example: 30">

        <button type="submit">Submit Crop Details</button>

    </form>

    <a class="back" href="{{ url_for('dashboard') }}">
        ← Back to Dashboard
    </a>

</div>

const categorySelect = document.getElementById("category");
const cropSelect = document.getElementById("crop_name");
const varietySelect = document.getElementById("variety");

categorySelect.addEventListener("change", function() {

    cropSelect.innerHTML = '<option value="">Select Crop</option>';
    varietySelect.innerHTML = '<option value="">Select Variety</option>';

    varietySelect.disabled = true;

    const category = this.value;

    if (cropData[category]) {

        Object.keys(cropData[category]).forEach(function(crop) {

            const option = document.createElement("option");
            option.value = crop;
            option.textContent = crop;

            cropSelect.appendChild(option);

        });

        cropSelect.disabled = false;

    } else {
        cropSelect.disabled = true;
    }

});

cropSelect.addEventListener("change", function() {

    varietySelect.innerHTML = '<option value="">Select Variety</option>';

    const category = categorySelect.value;
    const crop = this.value;

    if (cropData[category] && cropData[category][crop]) {

        cropData[category][crop].forEach(function(variety) {

            const option = document.createElement("option");
            option.value = variety;
            option.textContent = variety;

            varietySelect.appendChild(option);

        });

        varietySelect.disabled = false;

    } else {
        varietySelect.disabled = true;
    }

});

</script>
