{% extends "base.html" %}
{% block title %}Login | Smart Farmer{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Welcome back</h1><p class="muted">Log in to compare offers or manage buyer offers.</p>
  <form method="post">
    <label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
    <label>Password<input type="password" name="password" required placeholder="Your password"></label>
    <button class="button full" type="submit">Login</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</section>
{% endblock %}
